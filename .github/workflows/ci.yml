name: Format, Lint, Typecheck & Build

on:
  push:
    branches: ["arc/dev"]
  pull_request:
    branches: ["arc/dev"]

permissions:
  statuses: write

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://dummy:dummy@localhost.neon.tech/dummy"
      BETTER_AUTH_SECRET: "dummy"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check Formatting
        run: bun run format:check

      - name: Lint Code
        run: bun run lint:check

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build
