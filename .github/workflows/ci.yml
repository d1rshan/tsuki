name: Format, Lint, Test, Typecheck & Build

on:
  push:
    branches: ["arc/dev"]
  pull_request:
    branches: ["arc/dev"]

permissions:
  statuses: write

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://dummy:dummy@localhost.neon.tech/dummy"
      BETTER_AUTH_SECRET: "dummy"
      RESEND_API_KEY: "dummy"
      RESEND_FROM_EMAIL: "dummy"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check Formatting
        run: bun run format:check

      - name: Lint Code
        run: bun run lint:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: >-
          bun test
          packages/db/src/schema/tables/social.test.ts
          packages/db/src/dal/social.test.ts
          apps/api/src/modules/users/index.test.ts
          apps/api/src/modules/users/social.test.ts
          apps/web/src/features/profile/follow.test.ts

      - name: Build
        run: bun run build
